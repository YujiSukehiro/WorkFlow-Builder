[package]
name = "flowpulse-desktop"
version = "0.1.0"
description = "FlowPulse — Local AI Collaborative Result Map Studio (macOS Apple Silicon MLX)"
authors = ["FlowPulse"]
edition = "2021"

[lib]
name = "flowpulse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
